<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tudo em Código</title>
  <link rel="icon" type="image/x-icon" href="/marca/PNG/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/marca/PNG/tudoemcodigo-favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/marca/PNG/tudoemcodigo-icone-180-apple-touch.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080F28;
      color: #F9F9FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .wrapper {
      text-align: center;
      max-width: 480px;
      animation: fadeIn 0.8s ease-out;
    }
    .logo {
      width: 100%;
      max-width: 320px;
      height: auto;
      margin-bottom: 2rem;
      filter: drop-shadow(0 8px 24px rgba(10, 132, 255, 0.15));
    }
    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0A84FF;
      background: rgba(10, 132, 255, 0.1);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 9999px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <img src="/marca/SVG/tudoemcodigo-horizontal-fundo-escuro.svg" alt="Tudo em Código" class="logo">
    <div>
      <span class="status-badge">Em breve</span>
    </div>
  </div>
</body>
</html>
